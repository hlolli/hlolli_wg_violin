name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and generated data
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up the oldest supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python3 -m compileall -q benchmarks tests tools

      - name: Check model data and generators
        run: |
          python3 -B tools/fit_body_modes.py --check
          python3 -B tools/fit_body_modes.py --self-test
          python3 -B tools/generate_profiles.py --check
          python3 -B tools/generate_profiles.py --self-test
          python3 -B tools/generate_bach_chaconne_demo.py \
            --check examples/bach_chaconne_score.inc
          python3 -B tools/generate_caprice_24_demo.py \
            --check examples/paganini_caprice_24_score.inc \
            --analyzer-score "${RUNNER_TEMP}/caprice-score.csv" \
            --analyzer-labels "${RUNNER_TEMP}/caprice-labels.csv"

      - name: Run tool tests
        run: |
          python3 -B tests/test_caprice_analyzer_exports.py
          python3 -B tests/test_physical_probe_generator.py
          python3 -B tests/test_violin_fit_adapter.py
          python3 -B benchmarks/run_release_benchmark.py --self-test

  native:
    name: Linux native
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Check out Csound 7
        uses: actions/checkout@v6
        with:
          repository: csound/csound
          ref: fee3593e4c5f29a33bae6a0bab8994e5f4a3d32c
          path: _deps/csound

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison \
            build-essential \
            cmake \
            flex \
            gettext \
            libsamplerate0-dev \
            libsndfile1-dev \
            ninja-build

      - name: Configure Csound
        run: >-
          cmake -S _deps/csound -B _deps/csound-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_CSBEATS=OFF
          -DBUILD_PERFTHREAD_CLASS=OFF
          -DBUILD_PLUGINS=OFF
          -DBUILD_STATIC_LIBRARY=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_UTILITIES=OFF
          -DUSE_CURL=OFF
          -DUSE_DOUBLE=ON
          -DUSE_MP3=OFF

      - name: Build Csound
        run: >-
          cmake --build _deps/csound-build
          --target csound-bin --parallel 2

      - name: Configure the plugin
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DHLOLLI_CSOUND_BUILD_DIR=${{ github.workspace }}/_deps/csound-build
          -DHLOLLI_CSOUND_SOURCE_DIR=${{ github.workspace }}/_deps/csound
          -DCSOUND_EXECUTABLE=${{ github.workspace }}/_deps/csound-build/csound
          -DHLOLLI_WG_VIOLIN_STRICT_WARNINGS=ON
          -DHLOLLI_WG_VIOLIN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test installation
        run: cmake --install build --prefix "${RUNNER_TEMP}/install"

  wasm:
    name: Browser WASM
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Check out the browser opcode workbench
        uses: actions/checkout@v6
        with:
          repository: hlolli/csound-wasm-plugin-compiler
          ref: f2e1b1ad2faef3af10adf7c907a7f5a1ae748f73
          path: _deps/csound-wasm-plugin-compiler

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install browser workbench packages
        working-directory: _deps/csound-wasm-plugin-compiler
        run: bun install --frozen-lockfile

      - name: Prepare the browser source
        run: >-
          python3 -B tools/prepare_wasm_source.py
          --source src/hlolli_wg_violin.c
          --output build-wasm/hlolli_wg_violin.c

      - name: Compile and run in the browser workbench
        run: >-
          bun tools/run_wasm_workbench_test.ts
          --compiler-root _deps/csound-wasm-plugin-compiler
          --source build-wasm/hlolli_wg_violin.c
          --csd examples/wasm_smoke.csd
          --output build-wasm/facts.json
